name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pre-v4]

jobs:
  lint-and-test:
    name: Lint & LWC unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: LWC unit tests (with coverage)
        run: npm run test:unit:coverage
